- id: RF_HIGH_FEVER
  level: priority
  status: draft_needs_clinician_review
  reason_en: Very high fever was reported; staff review is needed.
  all_groups:
    - any:
        en: [fever 104, temperature 104, very high fever]
        hi: [१०४ बुखार, बहुत तेज बुखार]
        mr: [१०४ ताप, खूप जास्त ताप]
        hinglish: [104 fever, bahut tez bukhar]
