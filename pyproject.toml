[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/api"
files = ["services/api/app/core", "services/api/app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"
