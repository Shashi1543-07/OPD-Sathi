map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Page and file locations include security-headers.conf; /api responses carry the
    # API's own stricter headers.

    # The API is served from this same address under /api, so a phone that scans the
    # token QR code over Wi-Fi needs to reach only this one port (not localhost:8000).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so a client cannot fake its address for rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Kiosk audio WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Live queue and patient status use server-sent events.
        proxy_buffering off;
        proxy_read_timeout 1h;
        # The API scopes the staff refresh cookie to /auth; here that path is /api/auth.
        proxy_cookie_path /auth /api/auth;
        # Recorded answers and prescription photos.
        client_max_body_size 10m;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # The service worker and app shell must always be revalidated.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Single-page app: /kiosk, /staff and /s/<token> are client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
