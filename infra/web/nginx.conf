# Development and LAN-demo web server: plain HTTP. Production uses nginx.tls.conf (HTTPS only),
# mounted in its place by docker-compose.prod.yml. The container runs as an unprivileged
# user, so it listens on 8080.

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# This page's own WebSocket origin, named in the CSP's connect-src.
map $scheme $ws_origin {
    https "wss://$http_host";
    default "ws://$http_host";
}

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Recorded answers and photos of papers; the API itself stops at 1 MiB.
    client_max_body_size 1100k;

    # Page and file locations include security-headers.conf; /api responses carry the
    # API's own stricter headers.

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # The service worker and app shell must always be revalidated.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Single-page app: /kiosk, /staff and /s/<token> are client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
