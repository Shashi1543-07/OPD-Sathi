# Production web server: HTTPS only (Phase 7, tasks 7.2.1, 7.2.4 and 7.2.5).
#
# docker-compose.prod.yml mounts this file in place of nginx.conf, and the hospital's
# certificate at /etc/nginx/certs (tls.crt: the certificate followed by its chain, tls.key).
# See docs/DEPLOYMENT.md, "HTTPS", for the two certificate routes.
#
# TLS follows Mozilla's "intermediate" profile: TLS 1.2 and 1.3, forward-secret AEAD ciphers.
# The container runs as an unprivileged user, so it listens on 8080 and 8443; the overlay
# publishes them as 80 and 443.

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# This page's own WebSocket origin, named in the CSP's connect-src.
map $http_host $ws_origin {
    default "wss://$http_host";
}

# First line of defence before the API's own limits (task 7.2.4). Keyed by the client
# address as nginx sees it. Patients behind one Wi-Fi NAT share an address, so the check-in
# zones are generous: they stop floods, the API's per-session limits do the rest.
limit_req_zone $binary_remote_addr zone=signin:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=activate:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=checkin:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=status:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api:20m rate=1200r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server_tokens off;

server {
    listen 8080;
    server_name _;

    # Container health check only; everything else moves to HTTPS.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # The API stops at 1 MiB (MAX_REQUEST_BODY_BYTES); refuse anything larger here.
    client_max_body_size 1100k;
    limit_conn perip 200;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # nginx's own refusals (rate limits, oversized bodies, the API unreachable) answer like
    # the API, in problem JSON, and keep the security headers that error pages otherwise lose.
    error_page 413 @too_large;
    error_page 429 @rate_limited;
    error_page 502 503 504 @unavailable;
    # Plain HTTP sent to this HTTPS port: redirect instead of nginx's HTML error page.
    error_page 497 =301 https://$host:$server_port$request_uri;
    location @too_large {
        default_type application/problem+json;
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/tls-headers.inc;
        return 413 '{"type":"about:blank","title":"Request too large","status":413,"code":"REQUEST_TOO_LARGE"}';
    }
    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/tls-headers.inc;
        return 429 '{"type":"about:blank","title":"Too many requests","status":429,"code":"RATE_LIMITED"}';
    }
    location @unavailable {
        default_type application/problem+json;
        add_header Cache-Control no-store always;
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/tls-headers.inc;
        return 503 '{"type":"about:blank","title":"Service unavailable","status":503,"code":"SERVICE_UNAVAILABLE"}';
    }

    # Requests that check a password or a code (sign-in, refresh, two-step codes, password
    # change). Signed-in account pages (/auth/me, /auth/sessions) use the general API limit.
    location ~ ^/api/auth/(login|refresh|password|mfa/[a-z-]+)$ {
        limit_req zone=signin burst=10 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Kiosk pairing with a one-time code.
    location = /api/kiosks/activate {
        limit_req zone=activate burst=5 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Patients checking in on a kiosk or their own phone.
    location ~ ^/api/intake/ {
        limit_req zone=checkin burst=60 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Public status pages (each holds a long-lived event stream).
    location ~ ^/api/status/ {
        limit_req zone=status burst=60 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/tls-headers.inc;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/tls-headers.inc;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/tls-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
