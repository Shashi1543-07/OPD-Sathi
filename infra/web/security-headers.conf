# Security headers for the web app's own pages and files.
#
# Included in every location that sets its own add_header: nginx drops all inherited
# add_header lines as soon as a location defines one, which left the app without them.
#
# The CSP allows only this origin's scripts (the build has no inline script), so an
# injected <script> cannot run and read the kiosk's stored device credential. Styles
# need 'unsafe-inline' for React style attributes and the splash <style> in index.html.
# Images and media come only from this origin, data: and blob: (recorded-answer playback,
# generated audio, photos of papers being reviewed, the QR image). Connections go only to
# this origin, plus its own WebSocket address ($ws_origin, set in the server config) for the
# kiosk audio socket, which some browsers do not cover with 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' $ws_origin; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "microphone=(self), camera=(self)" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
# Every subresource is same-origin (the CSP allows nothing else), so requiring CORP costs
# nothing and isolates the page from cross-origin documents.
add_header Cross-Origin-Embedder-Policy require-corp always;
