# pgBackRest for one hospital server (Phase 7, task 7.7.2; ADR 011; docs/runbooks/restore.md).
#
# repo1 is on this server (volume pgbackrest-repo), encrypted. A second, off-site repository
# (repo2) is configured with PGBACKREST_REPO2_* variables (docs/DEPLOYMENT.md, "Backups").
# Passphrases and keys never appear here: with-backup-secrets reads them from secret files.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# Two full backups (one a week) and every differential and WAL segment between them: any
# point in the last 8 to 14 days can be restored.
repo1-retention-full=2
repo1-retention-full-type=count
compress-type=zst
compress-level=3
process-max=2
start-fast=y
# Read-only root filesystems: no log files, everything to the container log.
log-level-console=info
log-level-file=off
log-level-stderr=off
archive-async=n
# A WAL segment that cannot be archived for 5 minutes fails loudly instead of waiting.
archive-timeout=300

[osa]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
