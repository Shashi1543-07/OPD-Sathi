# Prometheus for one hospital server (Phase 7, task 7.9; ADR 010). Scrapes the stack on the
# private Docker network; nothing here is published outside the server.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]
  # nginx answers a fixed line on an internal-only port: "is the web server up?".
  - job_name: web
    static_configs:
      - targets: ["web:8081"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
