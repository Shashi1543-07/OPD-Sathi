groups:
  - name: opd-saathi-api
    rules:
      - alert: ApiRequestErrorRateHigh
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API server error rate is above 2% for five minutes
      - alert: ApiRequestLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API HTTP request p95 is above 1.5 seconds for five minutes
