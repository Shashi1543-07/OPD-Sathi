name: opd-saathi

services:
  postgres:
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      OSA_APP_PASSWORD: ${OSA_APP_PASSWORD:-}
      OSA_MIGRATOR_PASSWORD: ${OSA_MIGRATOR_PASSWORD:-}
      OSA_WORKER_PASSWORD: ${OSA_WORKER_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\"",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis-cache:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command:
      [
        "sh",
        "-c",
        "exec redis-server --save '' --appendonly no --maxmemory \"$$REDIS_CACHE_MAXMEMORY\" --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\"",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CACHE_MAXMEMORY: ${REDIS_CACHE_MAXMEMORY:-256mb}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  worker-role-bootstrap:
    image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    command: ["sh", "/scripts/bootstrap-worker-role.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-osa}
      POSTGRES_ADMIN_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-}
      OSA_WORKER_PASSWORD: ${OSA_WORKER_PASSWORD:-}
    volumes:
      - ./services/api/scripts/bootstrap-worker-role.sh:/scripts/bootstrap-worker-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    command: ["gunicorn", "--config", "/app/gunicorn.conf.py", "app.main:app"]
    environment: &app_environment
      APP_ENV: ${APP_ENV:-development}
      # API processes, and database connections each one keeps / may open (docs/SCALING.md).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-}
      PROVIDER_MODE: ${PROVIDER_MODE:-standard}
      DEMO_STORY: ${DEMO_STORY:-hindi-fever}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      # Address phones use to open the token QR link (start-demo.ps1 sets the PC's Wi-Fi IP).
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      # Browsers reach the API through the web container's /api proxy, which sends the real
      # client address; the API port itself only listens on 127.0.0.1.
      FORWARDED_ALLOW_IPS: "*"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_DATA_KEY: ${APP_DATA_KEY:-}
      APP_HMAC_KEY: ${APP_HMAC_KEY:-}
      # Opens only the phone numbers patients opted in to queue messages; the worker's one key.
      NOTIFY_KEY: ${NOTIFY_KEY:-}
      # Rotation (docs/runbooks/key-rotation.md) and two-step sign-in (ADR 008).
      APP_DATA_KEY_ID: ${APP_DATA_KEY_ID:-1}
      APP_DATA_PREVIOUS_KEYS: ${APP_DATA_PREVIOUS_KEYS:-}
      JWT_PREVIOUS_SECRET: ${JWT_PREVIOUS_SECRET:-}
      JWT_PREVIOUS_KID: ${JWT_PREVIOUS_KID:-}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES-admin}
      DATABASE_URL: postgresql+asyncpg://osa_app:${OSA_APP_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-osa}
      WORKER_DATABASE_URL: postgresql+asyncpg://osa_worker:${OSA_WORKER_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-osa}
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://osa_migrator:${OSA_MIGRATOR_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-osa}
      REDIS_STATE_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:-}@redis-cache:6379/0
      JWT_SECRET: ${JWT_SECRET:-development-only-signing-secret-change-before-deploy}
      JWT_KID: ${JWT_KID:-k1}
      CURSOR_HMAC_KEY: ${CURSOR_HMAC_KEY:-development-only-cursor-key-change-before-deploy}
      # AI and speech: "auto" uses whichever keys are present (Sarvam, then Gemini).
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      LLM_THINKING_LEVEL: ${LLM_THINKING_LEVEL:-minimal}
      AI_QUESTION_CHOICE: ${AI_QUESTION_CHOICE:-false}
      AI_FOLLOWUP_QUESTIONS: ${AI_FOLLOWUP_QUESTIONS:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-3.8-flash-tts}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Kore}
      STT_PROVIDER: ${STT_PROVIDER:-auto}
      TTS_PROVIDER: ${TTS_PROVIDER:-auto}
      TTS_MODEL: ${TTS_MODEL:-bulbul:v3}
      TTS_VOICE: ${TTS_VOICE:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker-role-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    command: ["python", "-m", "app.workers.main"]
    environment:
      <<: *app_environment
      PROCESS_ROLE: worker
      APP_DATA_KEY: ""
      APP_HMAC_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker-role-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Same address as the web app (nginx proxies /api), so phones can reach it too.
        VITE_API_URL: ${PUBLIC_API_URL:-/api}
    ports:
      # WEB_BIND=0.0.0.0 lets phones on the same Wi-Fi open the token status page.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.13@sha256:41bbc1b5e04416f81891806076db2a2ff60a5d4da5f78d36a88b033a8c199185
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
