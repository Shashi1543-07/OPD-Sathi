# Weekly update pull requests (Phase 7, tasks 7.0.4 and 7.4.3). Every one runs the full CI,
# including the image-pin check, before anyone can merge it.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/services/api", "/apps/web"]
    schedule: { interval: weekly, day: monday }
    groups:
      base-images: { patterns: ["*"] }
  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      compose-images: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: pip
    directory: "/services/api"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
