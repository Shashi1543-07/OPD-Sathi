name: Nightly load

# The OPD under load (Phase 7, tasks 7.8.2 and 7.8.3; docs/SCALING.md): the production-mode
# stack at a district hospital's peak for 15 minutes every night, and a soak of any length on
# demand (8 hours is a whole OPD day). Fails on a threshold crossed, a token issued twice, or
# a worker error. The reports are kept as an artifact.
on:
  schedule:
    - cron: "0 21 * * *" # 02:30 IST
  workflow_dispatch:
    inputs:
      duration:
        description: "How long (k6 duration, for example 15m or 8h)"
        default: "15m"
      arrivals_per_hour:
        description: "Patients checking in per hour"
        default: "300"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - run: pip install --require-hashes -r services/api/requirements.lock.txt
      - name: Load test
        env:
          DURATION: ${{ inputs.duration || '15m' }}
          ARRIVALS_PER_HOUR: ${{ inputs.arrivals_per_hour || '300' }}
          REPORT_DIR: load-reports
        run: bash scripts/load-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-reports
          path: load-reports/
