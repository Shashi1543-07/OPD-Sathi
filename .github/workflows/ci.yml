name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # A hung step (for example a stalled package mirror) fails fast instead of
    # holding the check for hours.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9@sha256:ddfe3e8713e3ee5b8f286082cb12512488dfbf3f5a1ecb0b74a42e6055af0a5f
        env:
          POSTGRES_DB: osa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d osa"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-inter fonts-noto-core libharfbuzz-subset0 libpango-1.0-0 libpangoft2-1.0-0 poppler-utils
      - run: bash services/api/scripts/init-db.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-postgres-password
          POSTGRES_USER: postgres
          POSTGRES_DB: osa
          OSA_APP_PASSWORD: ci-osa-app-password
          OSA_MIGRATOR_PASSWORD: ci-osa-migrator-password
          OSA_WORKER_PASSWORD: ci-osa-worker-password
      - run: pip install --require-hashes -r services/api/requirements.lock.txt
      - run: ruff check services/api/app services/api/tests services/api/scripts scripts
      # Every documented setting is read by something; every image is pinned by digest.
      - run: python scripts/check_env_example.py
      - run: python scripts/check_image_pins.py
      # Shell scripts are run directly (sudo ./scripts/setup-hospital.sh): keep them executable,
      # which a Windows checkout cannot show.
      - name: Shell scripts are executable
        run: |
          not_executable="$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')"
          test -z "$not_executable" || { echo "Not executable: $not_executable"; exit 1; }
      - run: mypy --strict services/api/app
      - run: PYTHONPATH=services/api python services/api/scripts/validate_question_bank.py
      - run: make prompts-audio-check
      - run: PYTHONPATH=services/api python eval/interview/evaluate.py
      - run: make eval-redflags
      - run: make eval-extraction eval-adversarial eval-redflags-llm
      - run: git diff --exit-code -- docs/EVALUATION.md eval/redflags/scripts.jsonl eval/routing/cases.jsonl eval/routing/evaluation.json
      - run: PYTHONPATH=services/api python services/api/scripts/write_case_sheet_schema.py --check
      # The printed paper fallback forms match the question bank and translations (7.7.7).
      - run: python scripts/make_paper_forms.py --check
      - run: alembic -c services/api/alembic.ini upgrade head && alembic -c services/api/alembic.ini downgrade base && alembic -c services/api/alembic.ini upgrade head
        env:
          MIGRATIONS_DATABASE_URL: postgresql+asyncpg://osa_migrator:ci-osa-migrator-password@localhost:5432/osa
      - run: pytest services/api/tests --cov=services/api/app --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://osa_app:ci-osa-app-password@localhost:5432/osa
          TEST_DATABASE_URL: postgresql+asyncpg://osa_app:ci-osa-app-password@localhost:5432/osa
          TEST_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://osa_migrator:ci-osa-migrator-password@localhost:5432/osa
          TEST_WORKER_DATABASE_URL: postgresql+asyncpg://osa_worker:ci-osa-worker-password@localhost:5432/osa
          REDIS_STATE_URL: redis://localhost:6379/0
          REDIS_CACHE_URL: redis://localhost:6379/1
      - run: coverage report --include='services/api/app/core/*,services/api/app/domain/*' --fail-under=95

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Ubuntu's package mirror sometimes stalls on hosted runners. apt itself times out and
      # retries a stalled download and waits for the package lock; between attempts, an
      # apt-get left running by a timed-out try (it runs under sudo, so `timeout` does not
      # stop it) is stopped and dpkg repaired, or it would hold the lock against the retry.
      - name: Install the Playwright browser
        timeout-minutes: 15
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "120";' |
            sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null
          for attempt in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Attempt $attempt failed; retrying"
            sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r services/api/requirements.lock.txt
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run e2e
      - run: npm run e2e:pwa
      - run: npm run build
      - run: npm run lighthouse:ci
      - run: npm run check-locales
      - run: npm run check-contrast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-1-visual-quality-results
          path: |
            docs/screenshots/phase-01/
            docs/screenshots/phase-02/
            apps/web/playwright-report/
            apps/web/.lighthouseci/
      - run: python services/api/scripts/write_openapi.py
        working-directory: .
      - run: npm run types
      - run: git diff --exit-code -- apps/web/src/lib/api-types.ts
        working-directory: .

  # The stack exactly as a hospital runs it: production overlay, secrets as files, HTTPS.
  # Drives one kiosk check-in and a doctor's call, and checks that no secret leaks (task 7.1.2).
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - run: pip install --require-hashes -r services/api/requirements.lock.txt
      - run: bash scripts/prod_smoke.sh
        env:
          # As on a hospital server: container logs to the systemd journal.
          OSA_LOG_DRIVER: journald

  # The images as shipped: scanned for fixable high and critical vulnerabilities, with a
  # CycloneDX SBOM for each (tasks 7.4.3, 7.14.3). Unfixed upstream issues are reported in the
  # table but cannot block: there is nothing to upgrade to.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -q -t opd-saathi-api:ci -f services/api/Dockerfile .
      - run: docker build -q -t opd-saathi-web:ci -f apps/web/Dockerfile .
      - run: docker build -q -t opd-saathi-postgres:ci -f infra/postgres/Dockerfile .
      - name: Scan and describe the images
        run: |
          mkdir -p sbom
          # Third-party images the production stack runs (Redis, Prometheus, Alertmanager).
          for image in $(POSTGRES_DB=osa POSTGRES_USER=postgres OSA_SECRETS_DIR=/tmp \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config --images |
            grep '@sha256:' | sort -u); do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --quiet --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
              --ignorefile /out/.trivyignore "$image"
          done
          for image in api web postgres; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"               aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --quiet --exit-code 1 --ignore-unfixed               --severity HIGH,CRITICAL --ignorefile /out/.trivyignore opd-saathi-$image:ci
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"               aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --quiet --format cyclonedx               --output /out/sbom/opd-saathi-$image.cdx.json opd-saathi-$image:ci
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Dependencies (npm), secrets and Dockerfile/Compose misconfiguration; Python
      # dependencies are audited by pip-audit below. Waivers: .trivyignore (ADR 009).
      - name: Trivy repository scan
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs --quiet --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore
          --scanners vuln,secret,misconfig --skip-dirs apps/web/node_modules .
      # Every alert rule is valid and fires on the condition it promises (ADR 010).
      - name: Alert rules and Alertmanager configuration
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/infra/monitoring:/m:ro" -w /m --entrypoint promtool \
            prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 \
            test rules alerts.test.yml
          ALERT_EMAIL=it@example.test SMTP_FROM=opd@example.test SMTP_HOST=localhost:25 \
            TELEGRAM_CHAT_ID=-100 bash scripts/alertmanager-config.sh "$RUNNER_TEMP/alertmanager.yml"
          docker run --rm -v "$RUNNER_TEMP/alertmanager.yml:/am.yml:ro" --entrypoint amtool \
            prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a \
            check-config /am.yml
      - name: Scan pushed commits for secrets
        if: github.event_name == 'push'
        env:
          GITLEAKS_BASE: ${{ github.event.before }}
          GITLEAKS_HEAD: ${{ github.sha }}
        run: |
          if [[ "$GITLEAKS_BASE" =~ ^0+$ ]] || ! git cat-file -e "${GITLEAKS_BASE}^{commit}" 2>/dev/null; then
            # New branch, or a force-push replaced the previous commit: scan everything.
            LOG_OPTS="--all"
          else
            git cat-file -e "${GITLEAKS_BASE}^{commit}"
            git cat-file -e "${GITLEAKS_HEAD}^{commit}"
            LOG_OPTS="${GITLEAKS_BASE}..${GITLEAKS_HEAD}"
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --log-opts="$LOG_OPTS" /repo
      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_BASE: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "${GITLEAKS_BASE}^{commit}"
          git cat-file -e "${GITLEAKS_HEAD}^{commit}"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --log-opts="${GITLEAKS_BASE}..${GITLEAKS_HEAD}" /repo
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r services/api/requirements.lock.txt
      - run: bandit -q -r services/api/app
      - run: pip-audit -r services/api/requirements.lock.txt
      # Temporary waivers for the CI-only Semgrep scanner, which pins mcp==1.29.0 and
      # opentelemetry-api~=1.37.0 in every release; neither reaches the application. See ADR 006.
      - run: >-
          pip-audit -r services/api/requirements-security.lock.txt
          --ignore-vuln GHSA-84m7-p3x7-pcfv --ignore-vuln CVE-2026-59951 --ignore-vuln CVE-2026-114603
      - run: pip install --require-hashes -r services/api/requirements-security.lock.txt
      - run: semgrep scan --config auto --error services/api/app
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
      - run: npm audit --audit-level=high
        working-directory: apps/web
